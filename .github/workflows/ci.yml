name: CI

on:
  push:
  pull_request:

jobs:
  cmake:
    name: CMake ${{ matrix.os }} ${{ matrix.cxx }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, cxx: g++ }
          - { os: ubuntu-latest, cxx: clang++ }
          - { os: macos-latest, cxx: clang++ }
          - { os: windows-latest, cxx: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        shell: bash
        run: |
          if [ -n "${{ matrix.cxx }}" ]; then export CXX=${{ matrix.cxx }}; fi
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

  sanitizers:
    name: Sanitizer ${{ matrix.sanitize }}
    strategy:
      fail-fast: false
      matrix:
        sanitize: [ "address,undefined", "thread" ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Allow ThreadSanitizer's memory layout
        run: sudo sysctl vm.mmap_rnd_bits=28
      - name: Build and run
        run: |
          clang++ -O1 -g -std=c++17 -fsanitize=${{ matrix.sanitize }} -fno-sanitize-recover=all -fno-omit-frame-pointer \
            -pthread -Iinclude tests/test_permute.cpp -o test_permute
          ./test_permute 1500

  x86-32:
    name: 32-bit x86
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y g++-multilib
      - run: |
          g++ -m32 -O2 -std=c++17 -Wall -Wextra -pthread -Iinclude tests/test_permute.cpp -o test_permute32
          ./test_permute32 800

  python:
    name: Python ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pytest numpy
      - name: Install PyTorch (CPU)
        if: runner.os == 'Linux'
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pytest -q tests/test_python.py
      - name: Benchmark script runs
        if: runner.os == 'Linux'
        run: python bench/bench_torch.py --quick --reps 1 --threads 1,2
